---
builds:
  - main
  - slim

options:
  common: "-Duseshrplib -Dvendorprefix=/usr/local"
  threaded: "-Dusethreads"

# Per-OS-family build restrictions. When a family appears here, only the
# listed builds are emitted for entries with that family. Default (key
# absent) = all builds apply. Empty list (e.g. `foo: []`) = skip entirely.
build_constraints:
  alpine: [main]   # no slim on alpine — alpine is already minimal

releases:
